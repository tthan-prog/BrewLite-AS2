# CI (Task 4.4, NFR-08): Install → Lint → Unit Test → Build cho mọi pull request và mỗi lần push lên main.
# Task 5: thêm test e2e (Prisma giả) và test tích hợp với PostgreSQL thật (service container).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Pipeline CD gọi lại CI trước khi build image
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install, Lint, Unit Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database chỉ dùng cho CI, tồn tại trong lúc job chạy
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm test

      - name: E2E Test (API, Prisma giả)
        run: npm run test:e2e -w apps/api

      - name: Migrate test database
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Integration Test (PostgreSQL thật)
        run: npm run test:int -w apps/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # Sprint 3 (US-20): E2E trên trình duyệt thật với API, web và PostgreSQL thật (đã migrate và seed).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite_e2e?schema=public
      JWT_SECRET: ci-e2e-only-secret
      WEB_ORIGIN: http://localhost:3000
      ORDER_EXPIRY_INTERVAL_MS: "0"
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate và seed database
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npm run seed

      - name: Build
        run: npm run build

      - name: Khởi động API và web
        run: |
          nohup node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          nohup npm run start -w apps/web > /tmp/web.log 2>&1 &
          npx --yes wait-on@8 -t 90000 http://localhost:3001/health http://localhost:3000/menu

      - name: Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Lưu báo cáo và log khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
